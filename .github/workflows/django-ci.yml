name: Django CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  django-tests:
    name: Django Tests and OpenAPI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: le_grand_cinema_ci
          POSTGRES_USER: cinema_ci
          POSTGRES_PASSWORD: cinema_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema_ci -d le_grand_cinema_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: django-ci-temporary-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

      DB_NAME: le_grand_cinema_ci
      DB_USER: cinema_ci
      DB_PASSWORD: cinema_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install -r ../requirements-dev.txt

      - name: Check Python code quality with Ruff
        run: |
          ruff check cinema config \
            --select E4,E7,E9,F

      - name: Check Django configuration
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test cinema.tests --verbosity 2

      - name: Validate OpenAPI schema
        run: |
          python manage.py spectacular \
            --validate \
            --fail-on-warn \
            --file /tmp/le-grand-cinema-openapi.yaml

